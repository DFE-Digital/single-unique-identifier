name: 'Build, Test, Deploy: "UI Test Harness" Solution'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for deployment
        required: false
        default: d01
        type: choice
        options:
          - d01
          - d02
          - d03
      deploy:
        description: Deploy to Azure Web App
        required: false
        default: false
        type: boolean
      upload_artifacts:
        description: Upload build artifacts (auto-enabled when deploying)
        required: false
        default: false
        type: boolean
      skip_tests:
        description: Skip tests and related setup
        required: false
        default: false
        type: boolean
      skip_scans:
        description: Skip SonarCloud scans
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "Apps/UIHarness/**"
      - "Data/**"
  pull_request:
    branches:
      - main

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_changes: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - "Apps/UIHarness/**"
              - "Data/**"
              - "global.json"
              - "nuget.config"
              - "Directory.Build.props"
              - "Directory.Build.targets"
              - "Directory.Packages.props"
              - ".github/workflows/ui-harness-build-and-deploy.yml"
              - ".github/workflows/build-test-dotnet.yml"

  build-and-test-UIHarness:
    name: UIHarness - Build Test Dotnet
    needs: detect-changes
    if: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.has_changes == 'true' }}
    uses: ./.github/workflows/build-test-dotnet.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      checks: write
      packages: read
    with:
      directory_name: Apps/UIHarness
      project_names: '["SUI.UIHarness.Web"]'
      upload_artifacts: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy == 'true' || github.event.inputs.upload_artifacts == 'true')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      # Below settings are uniquely changed for the UI Harness to enable deployment
      deploy_requested: false
      skip_tests: true
      skip_scans: true

  deploy-UIHarness:
    name: UIHarness - Deploy Web App
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build-and-test-UIHarness
    uses: ./.github/workflows/deploy-dotnet-webapp.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    permissions:
      id-token: write
      contents: read
      actions: read
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'd01' }}
      directory_name: Apps/UIHarness
      artifact_name: ${{ fromJson(needs.build-and-test-UIHarness.outputs.artifact_names)['SUI.UIHarness.Web'] }}
      artifact_run_id: ${{ github.run_id }}
      component_descriptor: uiharness01
      package_path: publish

  ci-gate:
    name: UIHarness - CI Gate
    needs: [ detect-changes, build-and-test-UIHarness ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI status
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          HAS_CHANGES: ${{ needs.detect-changes.outputs.has_changes }}
          BUILD_RESULT: ${{ needs.build-and-test-UIHarness.result }}
        run: |
          set -euo pipefail
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "detect-changes failed (result: $DETECT_RESULT)."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$HAS_CHANGES" != "true" ]]; then
            if [[ "$BUILD_RESULT" != "skipped" ]]; then
              echo "Expected build/test job to be skipped when no relevant files changed, got: $BUILD_RESULT."
              exit 1
            fi
            echo "No relevant changes detected; skip allowed."
            exit 0
          fi

          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "Relevant changes require build/test to pass, got: $BUILD_RESULT."
            exit 1
          fi