name: Trivy IaC Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_changes: ${{ steps.filter.outputs.iac }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Paths Filter
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            iac:
              - "terraform/**"
              - ".trivyignore"
              - ".github/workflows/trivy-iac.yml"

  trivy-iac:
    name: Run Trivy IaC scan
    needs: detect-changes
    if: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.has_changes == 'true' }}
    timeout-minutes: 15
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: .
          format: json
          output: trivy-iac-results.json
          severity: HIGH,CRITICAL
          exit-code: 0
          scanners: misconfig
          skip-dirs: |
            .config
            .git
            .github
            .husky
            .idea
            .run
            Apps
            Docs
            SystemTests
            coverage

      - name: Summarize Trivy IaC results
        id: summarize
        shell: bash
        run: |
          findings=$(jq '[.Results[]?.Misconfigurations[]?] | length' trivy-iac-results.json)
          echo "count=$findings" >> "$GITHUB_OUTPUT"

          {
            echo "### Trivy IaC Results"
            echo ""
            echo "- Findings: $findings"
            echo "- Severity threshold: HIGH,CRITICAL"

            if [[ "$findings" -gt 0 ]]; then
              echo ""
              echo "| Target | ID | Severity | Title |"
              echo "| --- | --- | --- | --- |"
              jq -r '
                .Results[]? as $result
                | $result.Misconfigurations[]?
                | "| \($result.Target) | \(.ID) | \(.Severity) | \(.Title | gsub("\\|"; "\\\\|")) |"
              ' trivy-iac-results.json
            else
              echo ""
              echo "No HIGH/CRITICAL IaC findings found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on HIGH/CRITICAL IaC findings
        if: steps.summarize.outputs.count != '0'
        shell: bash
        run: |
          echo "Trivy found ${{ steps.summarize.outputs.count }} HIGH/CRITICAL IaC findings."
          exit 1

  trivy-iac-gate:
    name: Trivy IaC scan
    needs: [ detect-changes, trivy-iac ]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Evaluate Trivy IaC scan status
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          HAS_CHANGES: ${{ needs.detect-changes.outputs.has_changes }}
          SCAN_RESULT: ${{ needs.trivy-iac.result }}
        run: |
          set -euo pipefail
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "detect-changes failed (result: $DETECT_RESULT)."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$HAS_CHANGES" != "true" ]]; then
            if [[ "$SCAN_RESULT" != "skipped" ]]; then
              echo "Expected Trivy IaC scan to be skipped when no relevant files changed, got: $SCAN_RESULT."
              exit 1
            fi
            echo "No relevant IaC changes detected; skip allowed."
            exit 0
          fi

          if [[ "$SCAN_RESULT" != "success" ]]; then
            echo "Relevant changes require Trivy IaC scan to pass, got: $SCAN_RESULT."
            exit 1
          fi