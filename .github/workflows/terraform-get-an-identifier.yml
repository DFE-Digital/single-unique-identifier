name: Terraform Get An Identifier
run-name: Terraform Get An Identifier - ${{ inputs.environment }} (${{ inputs.apply && 'apply' || 'plan' }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: d01
        type: choice
        options:
          - d01
          - d02
          - d03
      apply:
        description: Apply changes (otherwise plan only)
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - "terraform/get-an-identifier/**"
      - "terraform/modules/**"
      - "terraform/environments/d01.tfvars"
      - ".github/workflows/terraform-get-an-identifier.yml"
      - ".github/workflows/terraform-plan-and-apply.yml"
      - ".github/actions/load-tfvars/**"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Get An Identifier for ${{ inputs.environment }} (${{ inputs.apply && 'apply' || 'plan' }})
    uses: ./.github/workflows/terraform-plan-and-apply.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      NHS_DIGITAL_CLIENT_ID: ${{ secrets.NHS_DIGITAL_CLIENT_ID }}
      NHS_DIGITAL_KID: ${{ secrets.NHS_DIGITAL_KID }}
      NHS_DIGITAL_PRIVATE_KEY: ${{ secrets.NHS_DIGITAL_PRIVATE_KEY }}
      AUTH_SETTINGS__ISSUER: ${{ secrets.AUTH_SETTINGS__ISSUER }}
      AUTH_SETTINGS__AUDIENCE: ${{ secrets.AUTH_SETTINGS__AUDIENCE }}
      AUTH_SETTINGS__OIDC_DISCOVERY_URL: ${{ secrets.AUTH_SETTINGS__OIDC_DISCOVERY_URL }}
      AUTH_SETTINGS__ACCESS_TOKEN_URL: ${{ secrets.AUTH_SETTINGS__ACCESS_TOKEN_URL }}
      AUTH_SETTINGS__OAUTH_SCOPE: ${{ secrets.AUTH_SETTINGS__OAUTH_SCOPE }}
      AUTH_CLIENT_IDS_JSON_MAP: ${{ secrets.AUTH_CLIENT_IDS_JSON_MAP }}
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'd01' }}
      apply: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
      root: terraform/get-an-identifier
      state_key: ${{ format('{0}/getanidentifier.tfstate', (github.event_name == 'workflow_dispatch' && inputs.environment || 'd01')) }}
