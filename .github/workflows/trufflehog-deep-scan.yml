name: TruffleHog Deep Secret Scan

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-secret-scan:
    name: TruffleHog deep secret scan
    timeout-minutes: 30
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog deep secret scan
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          version: 3.93.8
          extra_args: --results=verified,unknown --exclude-paths=.github/trufflehog-exclude-paths.txt
