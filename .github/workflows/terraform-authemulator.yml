name: Terraform Auth Emulator
run-name: Terraform Auth Emulator - ${{ inputs.environment }} (${{ inputs.apply && 'apply' || 'plan' }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: d01
        type: choice
        options:
          - d01
          - d02
          # Support for deployment to d03 is not required here, FaUAPI is used with AuthStore instead
      apply:
        description: Apply changes (otherwise plan only)
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - "terraform/auth-emulator/**"
      - "terraform/modules/**"
      - "terraform/environments/d01.tfvars"
      - ".github/workflows/terraform-authemulator.yml"
      - ".github/workflows/terraform-plan-and-apply.yml"
      - ".github/actions/load-tfvars/**"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Auth Emulator for ${{ inputs.environment }} (${{ inputs.apply && 'apply' || 'plan' }})
    uses: ./.github/workflows/terraform-plan-and-apply.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AUTH_SETTINGS__ISSUER: ${{ secrets.AUTH_SETTINGS__ISSUER }}
      AUTH_SETTINGS__AUDIENCE: ${{ secrets.AUTH_SETTINGS__AUDIENCE }}
      AUTH_CLIENT_IDS_JSON_MAP: ${{ secrets.AUTH_CLIENT_IDS_JSON_MAP }}
      AUTH_CLIENT_SECRETS_JSON_MAP: ${{ secrets.AUTH_CLIENT_SECRETS_JSON_MAP }}
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'd01' }}
      apply: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
      root: terraform/auth-emulator
      state_key: ${{ format('{0}/authemulator.tfstate', (github.event_name == 'workflow_dispatch' && inputs.environment || 'd01')) }}
