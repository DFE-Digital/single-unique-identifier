name: Trivy Repository Scan

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"
      - "**/packages.lock.json"
      - ".github/workflows/trivy.yml"
      - "global.json"
      - "nuget.config"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"
      - "**/packages.lock.json"
      - ".github/workflows/trivy.yml"
      - "global.json"
      - "nuget.config"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  repository-scan:
    name: Trivy repository scan
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy repository scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: false
          format: table
          output: trivy-results.txt
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          vuln-type: os,library
          scanners: vuln,misconfig

      - name: Publish Trivy output to summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Trivy Repository Results"

            if [[ -s trivy-results.txt ]]; then
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```text'
              cat trivy-results.txt
              echo '```'
              echo "</details>"
            else
              echo ""
              echo "No repository scan report was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies for licence scanning
        run: dotnet restore FullSystem.slnx --packages .trivy-packages -p:RestoreUseStaticGraphEvaluation=true
        env:
          NuGetPackageSourceCredentials_DFEDigital: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

      - name: Print all detected licences
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .trivy-packages
          scanners: license
          skip-files: "**/*.deps.json"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: table
          output: trivy-license-results.txt
          exit-code: 0
          skip-setup-trivy: true
        env:
          TRIVY_LICENSE_FULL: "true"

      - name: Check for restricted or forbidden licences
        id: licence-policy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .trivy-packages
          scanners: license
          skip-files: "**/*.deps.json"
          severity: HIGH,CRITICAL
          format: table
          output: trivy-license-policy-results.txt
          exit-code: 1
          skip-setup-trivy: true
        env:
          TRIVY_LICENSE_FULL: "true"

      - name: Publish licence output to summary
        if: always()
        shell: bash
        env:
          POLICY_OUTCOME: ${{ steps.licence-policy.outcome }}
        run: |
          {
            echo "### Trivy Dependency Licence Results"
            echo ""

            if [[ "$POLICY_OUTCOME" == "success" ]]; then
              echo "- Policy check: Passed - no restricted or forbidden licences detected."
            elif [[ "$POLICY_OUTCOME" == "failure" ]]; then
              echo "- Policy check: Failed - restricted or forbidden licences detected."
            else
              echo "- Policy check: Did not complete."
            fi

            if [[ -s trivy-license-results.txt ]]; then
              echo ""
              echo "<details><summary>All detected licences</summary>"
              echo ""
              echo '```text'
              cat trivy-license-results.txt
              echo '```'
              echo "</details>"
            else
              echo ""
              echo "No licence scan report was generated."
            fi

            if [[ "$POLICY_OUTCOME" == "failure" && -s trivy-license-policy-results.txt ]]; then
              echo ""
              echo "<details open><summary>Restricted or forbidden licences</summary>"
              echo ""
              echo '```text'
              cat trivy-license-policy-results.txt
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on restricted or forbidden licences
        if: steps.licence-policy.outcome == 'failure'
        shell: bash
        run: exit 1
