name: Terraform Notification service
run-name: Terraform Notification service - ${{ inputs.environment }} (${{ inputs.apply && 'apply' || 'plan' }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: d01
        type: choice
        options:
          - d01
          - d02
          - d03
      apply:
        description: Apply changes (otherwise plan only)
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - "terraform/notification-service/**"
      - "terraform/modules/**"
      - "terraform/environments/d01.tfvars"
      - ".github/workflows/terraform-notification-service.yml"
      - ".github/workflows/terraform-plan-and-apply.yml"
      - ".github/actions/load-tfvars/**"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Notification service for ${{ inputs.environment }} (${{ inputs.apply && 'apply' || 'plan' }})
    uses: ./.github/workflows/terraform-plan-and-apply.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'd01' }}
      apply: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
      root: terraform/notification-service
      state_key: ${{ format('{0}/notificationservice.tfstate', (github.event_name == 'workflow_dispatch' && inputs.environment || 'd01')) }}
