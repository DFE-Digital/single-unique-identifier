# Validate release assets on PR/manual runs and publish only from main pushes.
name: "CI/CD Orchestrator"
run-name: Release build - ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip tests and related setup
        required: false
        default: false
        type: boolean
      skip_scans:
        description: Skip SonarCloud scans
        required: false
        default: false
        type: boolean
      force_deploy_all:
        description: Force build all components regardless of changes
        required: false
        default: false
        type: boolean


concurrency:
  # Main pushes select only their own changes; every push needs its own release run.
  group: ci-cd-orchestrator-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  path-filter:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      auth_emulator: ${{ steps.filter.outputs.auth_emulator }}
      get_an_id: ${{ steps.filter.outputs.get_an_id }}
      notification_service: ${{ steps.filter.outputs.notification_service }}
      ui_harness: ${{ steps.filter.outputs.ui_harness }}
      ci_helpers: ${{ steps.filter.outputs.ci_helpers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4, enterprise-approved SHA
        with:
          filters: |
            auth_emulator:
              - 'Apps/AuthEmulator/**'
              - 'Data/**'
              - 'global.json'
              - 'nuget.config'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/workflows/build-test-dotnet-release.yml'
              - '.github/workflows/attest-release-zips.yml'
              - '.github/workflows/ci-cd-orchestrator.yml'
              - '.github/workflows/publish-immutable-release.yml'
              - '.github/scripts/**'
            get_an_id:
              - 'Apps/GetAnIdentifier/**'
              - 'Data/**'
              - 'global.json'
              - 'nuget.config'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/workflows/build-test-dotnet-release.yml'
              - '.github/workflows/attest-release-zips.yml'
              - '.github/workflows/ci-cd-orchestrator.yml'
              - '.github/workflows/publish-immutable-release.yml'
              - '.github/scripts/**'
            notification_service:
              - 'Apps/NotificationService/**'
              - '.github/actions/package-container-from-artifact/**'
              - 'Libs/**'
              - 'terraform/notification-service/**'
              - 'terraform/core/**'
              - 'terraform/environments/**'
              - 'global.json'
              - 'nuget.config'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/workflows/build-test-dotnet-release.yml'
              - '.github/workflows/attest-release-zips.yml'
              - '.github/workflows/ci-cd-orchestrator.yml'
              - '.github/workflows/publish-immutable-release.yml'
              - '.github/scripts/**'
            ui_harness:
              - 'Apps/UIHarness/**'
              - 'Data/**'
              - 'global.json'
              - 'nuget.config'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/workflows/build-test-dotnet-release.yml'
              - '.github/workflows/attest-release-zips.yml'
              - '.github/workflows/ci-cd-orchestrator.yml'
              - '.github/workflows/publish-immutable-release.yml'
              - '.github/scripts/**'
            ci_helpers:
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/workflows/ci-cd-orchestrator.yml'
              - '.github/workflows/publish-immutable-release.yml'
              - '.github/workflows/test-ci-helpers.yml'

  build-auth-emulator:
    name: AuthEmulator - Build Test Dotnet
    needs: path-filter
    if: needs.path-filter.outputs.auth_emulator == 'true' || inputs.force_deploy_all
    uses: ./.github/workflows/build-test-dotnet-release.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      packages: read
    with:
      directory_name: Apps/AuthEmulator
      project_names: '["SUI.AuthEmulator"]'
      skip_tests: ${{ inputs.skip_tests || false }}
      skip_scans: ${{ inputs.skip_scans || false }}

  build-get-an-id:
    name: GetAnIdentifier - Build Test Dotnet
    needs: path-filter
    if: needs.path-filter.outputs.get_an_id == 'true' || inputs.force_deploy_all
    uses: ./.github/workflows/build-test-dotnet-release.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      packages: read
    with:
      directory_name: Apps/GetAnIdentifier
      project_names: '["SUI.GetAnIdentifier.API"]'
      requires_azurite: true
      skip_tests: ${{ inputs.skip_tests || false }}
      skip_scans: ${{ inputs.skip_scans || false }}

  build-ui-harness:
    name: UIHarness - Build Test Dotnet
    needs: path-filter
    if: needs.path-filter.outputs.ui_harness == 'true' || inputs.force_deploy_all
    uses: ./.github/workflows/build-test-dotnet-release.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      packages: read
    with:
      directory_name: Apps/UIHarness
      project_names: '["SUI.UIHarness.Web"]'
      skip_tests: true
      skip_scans: true

  build-notification-service:
    name: Notification Service - Build Test Dotnet
    needs: path-filter
    if: needs.path-filter.outputs.notification_service == 'true' || inputs.force_deploy_all
    uses: ./.github/workflows/build-test-dotnet-release.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      packages: read
    with:
      directory_name: Apps/NotificationService
      project_names: '["SUI.NotificationService"]'
      requires_azurite: true
      skip_tests: ${{ inputs.skip_tests || false }}
      skip_scans: ${{ inputs.skip_scans || false }}

  validate-container:
    name: Notification Service - validate container
    if: github.event_name != 'push' && (needs.path-filter.outputs.notification_service == 'true' || inputs.force_deploy_all)
    needs: [path-filter, build-notification-service]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Package and scan tested Notification Service output
        uses: ./.github/actions/package-container-from-artifact
        with:
          artifact-name: release-zips-NotificationService
          output-directory: notification-service-publish
          expected-file: SUI.NotificationService.dll
          dockerfile: Apps/NotificationService/Dockerfile.release
          image-tag: notification-service:${{ github.sha }}

  release-settings-check:
    name: Check release immutability before publication
    needs: [path-filter]
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.path-filter.result == 'success' &&
          (needs.path-filter.outputs.auth_emulator == 'true' ||
           needs.path-filter.outputs.get_an_id == 'true' ||
           needs.path-filter.outputs.notification_service == 'true' ||
           needs.path-filter.outputs.ui_harness == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify repository release immutability is enabled
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq .enabled)" = true

  publish-container:
    name: Notification Service - scan and publish tested container
    if: >-
      ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.path-filter.outputs.notification_service == 'true' &&
          needs.build-notification-service.result == 'success' &&
          needs.attest-release-zips.result == 'success' &&
          needs.release-settings-check.result == 'success' &&
          needs.trufflehog-scan.result == 'success' &&
          needs.trivy-scan.result == 'success' &&
          needs.trivy-iac-scan.result == 'success' &&
          (needs.path-filter.outputs.ci_helpers != 'true' || needs.release-script-tests.result == 'success') }}
    needs: [path-filter, build-notification-service, attest-release-zips, release-settings-check, trufflehog-scan, trivy-scan, trivy-iac-scan, release-script-tests]
    runs-on: ubuntu-latest
    environment: d01
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    outputs:
      repository: ${{ steps.registry.outputs.login_server }}/notification-service
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Package and scan attested Notification Service output
        id: package
        uses: ./.github/actions/package-container-from-artifact
        with:
          artifact-name: release-zips-NotificationService
          output-directory: published-output
          expected-file: SUI.NotificationService.dll
          dockerfile: Apps/NotificationService/Dockerfile.release
          image-tag: notification-service:${{ github.sha }}
          verify-attestation: 'true'
          source-sha: ${{ github.sha }}
          source-ref: refs/heads/main
          signer-workflow: ${{ github.repository }}/.github/workflows/attest-release-zips.yml
          github-token: ${{ github.token }}
      - name: Load environment naming
        id: environment
        uses: ./.github/actions/load-tfvars
        with:
          environment: d01
      - name: Azure login with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve Azure Container Registry
        id: registry
        env:
          REGISTRY_NAME: ${{ format('{0}{1}acr{2}services01', steps.environment.outputs.subscription_prefix, steps.environment.outputs.environment_id, steps.environment.outputs.region_short) }}
        run: |
          login_server=$(az acr show --name "$REGISTRY_NAME" --query loginServer --output tsv)
          test -n "$login_server"
          echo "name=$REGISTRY_NAME" >> "$GITHUB_OUTPUT"
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"
      - name: Push scanned image and record registry digest
        id: push
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.package.outputs.image-tag }}
        run: |
          set -euo pipefail
          az acr login --name "${{ steps.registry.outputs.name }}"
          image="${{ steps.registry.outputs.login_server }}/notification-service:${GITHUB_SHA}"
          docker tag "$LOCAL_IMAGE" "$image"
          docker push "$image"
          digest=$(az acr repository show --name "${{ steps.registry.outputs.name }}" \
            --image "notification-service:${GITHUB_SHA}" --query digest --output tsv)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          base=$(sed -n 's/^FROM .*@\(sha256:[0-9a-f]*\)$/\1/p' Apps/NotificationService/Dockerfile.release)
          test -n "$base"
          jq -n --arg repository "${{ steps.registry.outputs.login_server }}/notification-service" \
            --arg digest "$digest" --arg base_image mcr.microsoft.com/dotnet/runtime:10.0 \
            --arg base_digest "$base" \
            '{repository:$repository,digest:$digest,base_image:$base_image,base_digest:$base_digest,scan:"success",registry_publication:"success"}' \
            > container.json
      - name: Upload immutable container metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-container-metadata
          path: container.json

  trufflehog-scan:
    name: Trufflehog secret scan
    uses: ./.github/workflows/trufflehog.yml

  trivy-scan:
    name: Trivy repository scan
    uses: ./.github/workflows/trivy.yml
    with:
      enforce_vulnerability_gate: true
    secrets: inherit
    
  trivy-iac-scan:
    name: Trivy IaC scan
    uses: ./.github/workflows/trivy-iac.yml

  attest-release-zips:
    name: Attest tested deployment ZIPs
    needs: [path-filter, build-auth-emulator, build-get-an-id, build-ui-harness, build-notification-service]
    if: >-
      ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          (needs.path-filter.outputs.auth_emulator == 'true' ||
           needs.path-filter.outputs.get_an_id == 'true' ||
           needs.path-filter.outputs.ui_harness == 'true' ||
           needs.path-filter.outputs.notification_service == 'true') &&
          (needs.path-filter.outputs.auth_emulator != 'true' || needs.build-auth-emulator.result == 'success') &&
          (needs.path-filter.outputs.get_an_id != 'true' || needs.build-get-an-id.result == 'success') &&
          (needs.path-filter.outputs.ui_harness != 'true' || needs.build-ui-harness.result == 'success') &&
          (needs.path-filter.outputs.notification_service != 'true' || needs.build-notification-service.result == 'success') }}
    uses: ./.github/workflows/attest-release-zips.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write

  release-script-tests:
    name: Test CI helpers when changed
    needs: [path-filter]
    if: needs.path-filter.outputs.ci_helpers == 'true'
    uses: ./.github/workflows/test-ci-helpers.yml
    permissions:
      contents: read

  prepare-release-assets:
    name: Prepare release assets
    needs:
      - path-filter
      - build-auth-emulator
      - build-get-an-id
      - build-ui-harness
      - build-notification-service
      - attest-release-zips
      - publish-container
    if: >-
      ${{ always() &&
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.path-filter.result == 'success' &&
          needs.attest-release-zips.result == 'success' &&
          (needs.path-filter.outputs.auth_emulator == 'true' ||
           needs.path-filter.outputs.get_an_id == 'true' ||
           needs.path-filter.outputs.notification_service == 'true' ||
           needs.path-filter.outputs.ui_harness == 'true') &&
          (needs.path-filter.outputs.auth_emulator != 'true' || needs.build-auth-emulator.result == 'success') &&
          (needs.path-filter.outputs.get_an_id != 'true' || needs.build-get-an-id.result == 'success') &&
          (needs.path-filter.outputs.ui_harness != 'true' || needs.build-ui-harness.result == 'success') &&
          (needs.path-filter.outputs.notification_service != 'true' ||
           (needs.build-notification-service.result == 'success' && needs.publish-container.result == 'success')) }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download selected release ZIPs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-zips-*
          path: drop
          merge-multiple: true
      - name: Download published container metadata
        if: needs.publish-container.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-container-metadata
          path: container-drop
      - name: Prepare release manifest and asset list
        id: prepare
        env:
          AUTH: ${{ needs.path-filter.outputs.auth_emulator }}
          GET_AN_ID: ${{ needs.path-filter.outputs.get_an_id }}
          NOTIFICATION: ${{ needs.path-filter.outputs.notification_service }}
          UI: ${{ needs.path-filter.outputs.ui_harness }}
        run: node .github/scripts/release-manifest.mjs
      - name: Upload release asset bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  cut-release:
    name: Publish ${{ matrix.component.name }} release
    needs:
      - path-filter
      - build-auth-emulator
      - build-get-an-id
      - build-ui-harness
      - build-notification-service
      - attest-release-zips
      - publish-container
      - trufflehog-scan
      - trivy-scan
      - trivy-iac-scan
      - release-script-tests
      - release-settings-check
      - prepare-release-assets
    if: >-
      ${{ always() &&
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.path-filter.result == 'success' &&
          needs.trufflehog-scan.result == 'success' &&
          needs.trivy-scan.result == 'success' &&
          needs.trivy-iac-scan.result == 'success' &&
          (needs.path-filter.outputs.ci_helpers != 'true' || needs.release-script-tests.result == 'success') &&
          needs.release-settings-check.result == 'success' &&
          needs.attest-release-zips.result == 'success' &&
          needs.prepare-release-assets.result == 'success' &&
          (needs.path-filter.outputs.auth_emulator == 'true' ||
           needs.path-filter.outputs.get_an_id == 'true' ||
           needs.path-filter.outputs.notification_service == 'true' ||
           needs.path-filter.outputs.ui_harness == 'true') &&
          (needs.path-filter.outputs.auth_emulator != 'true' || needs.build-auth-emulator.result == 'success') &&
          (needs.path-filter.outputs.get_an_id != 'true' || needs.build-get-an-id.result == 'success') &&
          (needs.path-filter.outputs.ui_harness != 'true' || needs.build-ui-harness.result == 'success') &&
          (needs.path-filter.outputs.notification_service != 'true' ||
           (needs.build-notification-service.result == 'success' && needs.publish-container.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-release-assets.outputs.matrix) }}
    uses: ./.github/workflows/publish-immutable-release.yml
    permissions:
      contents: write
      actions: read
      attestations: read
    with:
      assets_artifact_name: release-assets
      asset_subdirectory: ${{ matrix.component.name }}
      attested_asset_glob: '*.zip'
      manifest_filename: release-manifest.json
      release_tag: sui-${{ matrix.component.slug }}-${{ github.sha }}
      source_sha: ${{ github.sha }}
      source_ref: refs/heads/main
      signer_workflow: ${{ github.repository }}/.github/workflows/attest-release-zips.yml
      release_title: ${{ matrix.component.name }} deployable build ${{ github.sha }}
      release_notes: Tested ${{ matrix.component.name }} deployment asset from ${{ github.sha }}.
    secrets:
      release_settings_read_token: ${{ secrets.RELEASE_SETTINGS_READ_TOKEN }}
