# Safe validation only. Release publication remains disabled.
name: "CI/CD Orchestrator (release validation)"
run-name: Release validation - ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip tests and related setup
        required: false
        default: false
        type: boolean
      skip_scans:
        description: Skip SonarCloud scans
        required: false
        default: false
        type: boolean
      force_deploy_all:
        description: Force build all components regardless of changes
        required: false
        default: false
        type: boolean


concurrency:
  group: ci-cd-orchestrator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  path-filter:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      auth_emulator: ${{ steps.filter.outputs.auth_emulator }}
      get_an_id: ${{ steps.filter.outputs.get_an_id }}
      notification_service: ${{ steps.filter.outputs.notification_service }}
      ui_harness: ${{ steps.filter.outputs.ui_harness }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4, enterprise-approved SHA
        with:
          filters: |
            auth_emulator:
              - 'Apps/AuthEmulator/**'
              - 'Data/**'
              - 'global.json'
              - 'nuget.config'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/workflows/build-test-dotnet-release.yml'
              - '.github/workflows/attest-release-zips.yml'
              - '.github/workflows/ci-cd-orchestrator.yml'
              - '.github/scripts/**'
            get_an_id:
              - 'Apps/GetAnIdentifier/**'
              - 'Data/**'
              - 'global.json'
              - 'nuget.config'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/workflows/build-test-dotnet-release.yml'
              - '.github/workflows/attest-release-zips.yml'
              - '.github/workflows/ci-cd-orchestrator.yml'
              - '.github/scripts/**'
            notification_service:
              - 'Apps/NotificationService/**'
              - 'Libs/**'
              - 'terraform/notification-service/**'
              - 'terraform/core/**'
              - 'terraform/environments/**'
              - 'global.json'
              - 'nuget.config'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/workflows/build-test-dotnet-release.yml'
              - '.github/workflows/attest-release-zips.yml'
              - '.github/workflows/ci-cd-orchestrator.yml'
              - '.github/scripts/**'
            ui_harness:
              - 'Apps/UIHarness/**'
              - 'Data/**'
              - 'global.json'
              - 'nuget.config'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/workflows/build-test-dotnet-release.yml'
              - '.github/workflows/attest-release-zips.yml'
              - '.github/workflows/ci-cd-orchestrator.yml'
              - '.github/scripts/**'

  build-auth-emulator:
    name: AuthEmulator - Build Test Dotnet
    needs: path-filter
    if: needs.path-filter.outputs.auth_emulator == 'true' || inputs.force_deploy_all
    uses: ./.github/workflows/build-test-dotnet-release.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      packages: read
    with:
      directory_name: Apps/AuthEmulator
      project_names: '["SUI.AuthEmulator"]'
      skip_tests: ${{ inputs.skip_tests || false }}
      skip_scans: ${{ inputs.skip_scans || false }}

  build-get-an-id:
    name: GetAnIdentifier - Build Test Dotnet
    needs: path-filter
    if: needs.path-filter.outputs.get_an_id == 'true' || inputs.force_deploy_all
    uses: ./.github/workflows/build-test-dotnet-release.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      packages: read
    with:
      directory_name: Apps/GetAnIdentifier
      project_names: '["SUI.GetAnIdentifier.API"]'
      requires_azurite: true
      skip_tests: ${{ inputs.skip_tests || false }}
      skip_scans: ${{ inputs.skip_scans || false }}

  build-ui-harness:
    name: UIHarness - Build Test Dotnet
    needs: path-filter
    if: needs.path-filter.outputs.ui_harness == 'true' || inputs.force_deploy_all
    uses: ./.github/workflows/build-test-dotnet-release.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      packages: read
    with:
      directory_name: Apps/UIHarness
      project_names: '["SUI.UIHarness.Web"]'
      skip_tests: true
      skip_scans: true

  build-notification-service:
    name: Notification Service - Build Test Dotnet
    needs: path-filter
    if: needs.path-filter.outputs.notification_service == 'true' || inputs.force_deploy_all
    uses: ./.github/workflows/build-test-dotnet-release.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      packages: read
    with:
      directory_name: Apps/NotificationService
      project_names: '["SUI.NotificationService"]'
      requires_azurite: true
      skip_tests: ${{ inputs.skip_tests || false }}
      skip_scans: ${{ inputs.skip_scans || false }}

  validate-container:
    name: Notification Service - validate container
    if: needs.path-filter.outputs.notification_service == 'true' || inputs.force_deploy_all
    needs: [path-filter, build-notification-service]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download tested Notification Service ZIP
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-zips-NotificationService
          path: drop

      - name: Extract tested publish output
        shell: bash
        run: |
          shopt -s nullglob
          zips=(drop/*.zip)
          if [[ ${#zips[@]} -ne 1 ]]; then
            echo "Expected exactly one Notification Service ZIP, found ${#zips[@]}" >&2
            exit 1
          fi
          mkdir notification-service-publish
          unzip -q "${zips[0]}" -d notification-service-publish
          test -f notification-service-publish/SUI.NotificationService.dll

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Package tested output into container without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: notification-service-publish
          file: Apps/NotificationService/Dockerfile.release
          platforms: linux/amd64
          load: true
          push: false
          tags: notification-service:${{ github.sha }}

      - name: Scan local image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notification-service:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

  trufflehog-scan:
    name: Trufflehog secret scan
    uses: ./.github/workflows/trufflehog.yml

  trivy-scan:
    name: Trivy repository scan
    uses: ./.github/workflows/trivy.yml
    with:
      enforce_vulnerability_gate: true
    secrets: inherit
    
  trivy-iac-scan:
    name: Trivy IaC scan
    uses: ./.github/workflows/trivy-iac.yml

  attest-release-zips:
    name: Attest tested deployment ZIPs
    needs: [path-filter, build-auth-emulator, build-get-an-id, build-ui-harness, build-notification-service]
    if: >-
      ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          (needs.path-filter.outputs.auth_emulator == 'true' ||
           needs.path-filter.outputs.get_an_id == 'true' ||
           needs.path-filter.outputs.ui_harness == 'true' ||
           needs.path-filter.outputs.notification_service == 'true') &&
          (needs.path-filter.outputs.auth_emulator != 'true' || needs.build-auth-emulator.result == 'success') &&
          (needs.path-filter.outputs.get_an_id != 'true' || needs.build-get-an-id.result == 'success') &&
          (needs.path-filter.outputs.ui_harness != 'true' || needs.build-ui-harness.result == 'success') &&
          (needs.path-filter.outputs.notification_service != 'true' || needs.build-notification-service.result == 'success') }}
    uses: ./.github/workflows/attest-release-zips.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
