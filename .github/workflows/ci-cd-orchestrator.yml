# Safe validation only. Release publication remains disabled.
name: "CI/CD Orchestrator (release validation)"
run-name: Release validation - ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip tests and related setup
        required: false
        default: false
        type: boolean
      skip_scans:
        description: Skip SonarCloud scans
        required: false
        default: false
        type: boolean
      force_deploy_all:
        description: Force build all components regardless of changes
        required: false
        default: false
        type: boolean


concurrency:
  group: ci-cd-orchestrator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  attestations: write
  pull-requests: write
  checks: write
  packages: read
  actions: write
  id-token: write

jobs:
  path-filter:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      auth_emulator: ${{ steps.filter.outputs.auth_emulator }}
      get_an_id: ${{ steps.filter.outputs.get_an_id }}
      notification_service: ${{ steps.filter.outputs.notification_service }}
      ui_harness: ${{ steps.filter.outputs.ui_harness }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            auth_emulator:
              - 'Apps/AuthEmulator/**'
              - 'Data/**'
              - 'global.json'
              - 'nuget.config'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/workflows/build-test-dotnet-release.yml'
              - '.github/workflows/ci-cd-orchestrator.yml'
              - '.github/scripts/**'
            get_an_id:
              - 'Apps/GetAnIdentifier/**'
              - 'Data/**'
              - 'global.json'
              - 'nuget.config'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/workflows/build-test-dotnet-release.yml'
              - '.github/workflows/ci-cd-orchestrator.yml'
              - '.github/scripts/**'
            notification_service:
              - 'Apps/NotificationService/**'
              - 'Libs/**'
              - 'terraform/notification-service/**'
              - 'terraform/core/**'
              - 'terraform/environments/**'
              - 'global.json'
              - 'nuget.config'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/workflows/build-test-dotnet-release.yml'
              - '.github/workflows/ci-cd-orchestrator.yml'
              - '.github/scripts/**'
            ui_harness:
              - 'Apps/UIHarness/**'
              - 'Data/**'
              - 'global.json'
              - 'nuget.config'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/workflows/build-test-dotnet-release.yml'
              - '.github/workflows/ci-cd-orchestrator.yml'
              - '.github/scripts/**'

  build-auth-emulator:
    name: AuthEmulator - Build Test Dotnet
    needs: path-filter
    if: needs.path-filter.outputs.auth_emulator == 'true' || inputs.force_deploy_all
    uses: ./.github/workflows/build-test-dotnet-release.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: write
      attestations: write
      pull-requests: write
      checks: write
      packages: read
      actions: write
    with:
      directory_name: Apps/AuthEmulator
      project_names: '["SUI.AuthEmulator"]'
      upload_artifacts: true
      prepare_release_assets: true
      skip_tests: ${{ inputs.skip_tests || false }}
      skip_scans: ${{ inputs.skip_scans || false }}
      deploy_requested: false

  build-get-an-id:
    name: GetAnIdentifier - Build Test Dotnet
    needs: path-filter
    if: needs.path-filter.outputs.get_an_id == 'true' || inputs.force_deploy_all
    uses: ./.github/workflows/build-test-dotnet-release.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: write
      attestations: write
      pull-requests: write
      checks: write
      packages: read
      actions: write
    with:
      directory_name: Apps/GetAnIdentifier
      project_names: '["SUI.GetAnIdentifier.API"]'
      requires_azurite: true
      upload_artifacts: true
      prepare_release_assets: true
      skip_tests: ${{ inputs.skip_tests || false }}
      skip_scans: ${{ inputs.skip_scans || false }}
      deploy_requested: false

  build-ui-harness:
    name: UIHarness - Build Test Dotnet
    needs: path-filter
    if: needs.path-filter.outputs.ui_harness == 'true' || inputs.force_deploy_all
    uses: ./.github/workflows/build-test-dotnet-release.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: write
      attestations: write
      pull-requests: write
      checks: write
      packages: read
      actions: write
    with:
      directory_name: Apps/UIHarness
      project_names: '["SUI.UIHarness.Web"]'
      upload_artifacts: true
      prepare_release_assets: true
      skip_tests: true
      skip_scans: true
      deploy_requested: false

  build-notification-service:
    name: Notification Service - Build Test Dotnet
    needs: path-filter
    if: needs.path-filter.outputs.notification_service == 'true' || inputs.force_deploy_all
    uses: ./.github/workflows/build-test-dotnet-release.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: write
      attestations: write
      pull-requests: write
      checks: write
      packages: read
      actions: write
    with:
      directory_name: Apps/NotificationService
      project_names: '["SUI.NotificationService"]'
      requires_azurite: true
      deploy_requested: false
      upload_artifacts: true
      prepare_release_assets: true
      skip_tests: ${{ inputs.skip_tests || false }}
      skip_scans: ${{ inputs.skip_scans || false }}

  validate-container:
    name: Notification Service - validate container
    if: needs.path-filter.outputs.notification_service == 'true' || inputs.force_deploy_all
    needs: path-filter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build container image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Apps/NotificationService/Dockerfile
          load: true
          push: false
          tags: notification-service:${{ github.sha }}

      - name: Scan local image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notification-service:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

  trufflehog-scan:
    name: Trufflehog secret scan
    uses: ./.github/workflows/trufflehog.yml

  trivy-scan:
    name: Trivy repository scan
    uses: ./.github/workflows/trivy.yml
    with:
      enforce_vulnerability_gate: true
    secrets: inherit
    
  trivy-iac-scan:
    name: Trivy IaC scan
    uses: ./.github/workflows/trivy-iac.yml
