name: 'Build, Test, Deploy: "Auth Emulator" Solution'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for deployment
        required: false
        default: d01
        type: choice
        options:
          - d01
          - d02
          # Support for deployment to d03 is not required here, FaUAPI is used with AuthStore instead
      deploy:
        description: Deploy to Azure Web App
        required: false
        default: false
        type: boolean
      upload_artifacts:
        description: Upload build artifacts (auto-enabled when deploying)
        required: false
        default: false
        type: boolean
      skip_tests:
        description: Skip tests and related setup
        required: false
        default: false
        type: boolean
      skip_scans:
        description: Skip SonarCloud scans
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "Apps/AuthEmulator/**"
      - "Data/**"
  pull_request:
    branches:
      - main
    paths:
      - "Apps/AuthEmulator/**"
      - "Data/**"

jobs:
  build-and-test-AuthEmulator:
    name: AuthEmulator - Build Test Dotnet
    uses: ./.github/workflows/build-test-dotnet.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      checks: write
      packages: read
    with:
      directory_name: Apps/AuthEmulator
      project_names: '["SUI.AuthEmulator"]'
      upload_artifacts: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy == 'true' || github.event.inputs.upload_artifacts == 'true')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      skip_tests: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true' }}
      skip_scans: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_scans == 'true' }}
      deploy_requested: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' }}

  deploy-AuthEmulator:
    name: AuthEmulator - Deploy Web App
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build-and-test-AuthEmulator
    uses: ./.github/workflows/deploy-dotnet-webapp.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    permissions:
      id-token: write
      contents: read
      actions: read
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'd01' }}
      directory_name: Apps/AuthEmulator
      artifact_name: ${{ fromJson(needs.build-and-test-AuthEmulator.outputs.artifact_names)['SUI.AuthEmulator'] }}
      artifact_run_id: ${{ github.run_id }}
      component_descriptor: authemulator01
      package_path: publish
