name: Publish immutable release

on:
  workflow_call:
    inputs:
      assets_artifact_name:
        description: Actions artifact containing the release manifest and assets
        required: true
        type: string
      asset_subdirectory:
        description: Component directory within the release asset artifact
        required: true
        type: string
      attested_asset_glob:
        description: Filename pattern, relative to the artifact, for assets requiring build attestation verification
        required: true
        type: string
      manifest_filename:
        description: Required release manifest filename in the artifact
        required: true
        type: string
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      source_ref:
        description: Trusted source ref expected in each build attestation
        required: true
        type: string
      signer_workflow:
        description: Trusted workflow identity expected in each build attestation
        required: true
        type: string
      release_title:
        required: true
        type: string
      release_notes:
        required: true
        type: string
    outputs:
      release_id:
        description: Published GitHub Release ID
        value: ${{ jobs.publish.outputs.release_id }}
      release_url:
        description: Published GitHub Release URL
        value: ${{ jobs.publish.outputs.release_url }}

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == inputs.source_ref
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: read
    outputs:
      release_id: ${{ steps.published.outputs.release_id }}
      release_url: ${{ steps.published.outputs.release_url }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.assets_artifact_name }}
          path: release-assets

      - name: Verify release asset inventory and build attestations
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_GLOB: ${{ inputs.attested_asset_glob }}
          ASSET_SUBDIRECTORY: ${{ inputs.asset_subdirectory }}
          MANIFEST_FILENAME: ${{ inputs.manifest_filename }}
          SIGNER_WORKFLOW: ${{ inputs.signer_workflow }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eEuo pipefail
          stage="validate release inputs"
          trap 'status=$?; if (( status != 0 )); then printf "::error::Release verification failed at %s (exit %s)\n" "$stage" "$status" >&2; printf "failed_stage=%s\n" "$stage" >> "$GITHUB_OUTPUT"; fi' EXIT
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ "$ASSET_SUBDIRECTORY" =~ ^[A-Za-z0-9_-]+$ ]]
          stage="inspect asset inventory"
          asset_dir="release-assets/$ASSET_SUBDIRECTORY"
          [[ -n "$RELEASE_TAG" && -n "$SIGNER_WORKFLOW" && -n "$SOURCE_REF" && -n "$ASSET_GLOB" ]]
          [[ "$MANIFEST_FILENAME" != */* ]]
          test -s "$asset_dir/$MANIFEST_FILENAME"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" \
            '.release.tag == $tag and .release.source_sha == $sha' \
            "$asset_dir/$MANIFEST_FILENAME" >/dev/null

          # A component release contains its manifest and one original, attested ZIP.
          mapfile -d '' release_files < <(find "$asset_dir" -maxdepth 1 -type f -print0)
          (( ${#release_files[@]} == 2 ))
          mapfile -d '' attested_assets < <(find "$asset_dir" -maxdepth 1 -type f -name "$ASSET_GLOB" -print0)
          (( ${#attested_assets[@]} == 1 ))
          jq -e --arg component "$ASSET_SUBDIRECTORY" --arg filename "$(basename "${attested_assets[0]}")" \
            '.assets == [{component:$component,filename:$filename}]' \
            "$asset_dir/$MANIFEST_FILENAME" >/dev/null
          stage="verify ZIP attestation"
          for asset in "${attested_assets[@]}"; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$SOURCE_SHA" --source-ref "$SOURCE_REF"
          done

      - name: Create and publish immutable release
        id: published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_SUBDIRECTORY: ${{ inputs.asset_subdirectory }}
          MANIFEST_FILENAME: ${{ inputs.manifest_filename }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -eEuo pipefail
          stage="prepare release inventory"
          trap 'status=$?; if (( status != 0 )); then printf "::error::Release publication failed at %s (exit %s)\n" "$stage" "$status" >&2; printf "failed_stage=%s\n" "$stage" >> "$GITHUB_OUTPUT"; fi' EXIT
          printf 'Component: %s\nSource SHA: %s\nTag: %s\nRun: %s (attempt %s)\n' "$ASSET_SUBDIRECTORY" "$SOURCE_SHA" "$RELEASE_TAG" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          tag_ref=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
          ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag_ref}"
          local_manifest="release-assets/$ASSET_SUBDIRECTORY/$MANIFEST_FILENAME"
          mapfile -d '' release_files < <(find "release-assets/$ASSET_SUBDIRECTORY" -maxdepth 1 -type f -print0)
          (( ${#release_files[@]} == 2 ))
          expected_assets=$(
            for file in "${release_files[@]}"; do
              hash=$(sha256sum "$file" | cut -c1-64)
              jq -nc --arg name "$(basename "$file")" --arg digest "sha256:$hash" \
                '{name:$name,digest:$digest}'
            done | jq -sc 'sort_by(.name)'
          )

          # List releases so unpublished drafts are found as well as published releases.
          get_release() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -sc --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)] |
                 if length == 0 then null elif length == 1 then .[0] else error("Duplicate release tag") end'
          }
          verify_inventory() {
            if ! jq -e --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" \
              --argjson expected "$expected_assets" --argjson draft "$2" \
              '.tag_name == $tag and .target_commitish == $sha and .draft == $draft and
               ([.assets[] | {name,digest}] | sort_by(.name)) == $expected' <<< "$1" >/dev/null; then
              printf 'Expected assets: %s\nObserved assets: %s\n' "$expected_assets" "$(jq -c '[.assets[] | {name,digest}] | sort_by(.name)' <<< "$1")" >&2
              return 1
            fi
          }
          # A rerun changes the manifest's attempt and timestamp. Verify the published
          # manifest's own digest and all stable fields before reusing its immutable release.
          verify_published_retry() {
            local zip_name zip_digest manifest_digest downloaded_manifest
            zip_name=$(jq -r '.assets[0].filename' "$local_manifest")
            zip_digest=$(jq -r --arg name "$zip_name" '.[] | select(.name == $name) | .digest' <<< "$expected_assets")
            jq -e --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" \
              --arg manifest "$MANIFEST_FILENAME" --arg zip "$zip_name" --arg digest "$zip_digest" \
              '.tag_name == $tag and .target_commitish == $sha and .draft == false and .immutable == true and
               (.assets | length) == 2 and
               any(.assets[]; .name == $zip and .digest == $digest) and
               any(.assets[]; .name == $manifest and (.digest | test("^sha256:[0-9a-f]{64}$")))' \
              <<< "$1" >/dev/null
            manifest_digest=$(jq -r --arg name "$MANIFEST_FILENAME" \
              '.assets[] | select(.name == $name) | .digest' <<< "$1")
            mkdir -p published-manifest
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$MANIFEST_FILENAME" --dir published-manifest --clobber
            downloaded_manifest="published-manifest/$MANIFEST_FILENAME"
            test "sha256:$(sha256sum "$downloaded_manifest" | cut -c1-64)" = "$manifest_digest"
            jq -e '.release.workflow_run_attempt | test("^[1-9][0-9]*$")' "$downloaded_manifest" >/dev/null
            jq -e '.release.generated_at | fromdateiso8601' "$downloaded_manifest" >/dev/null
            jq -s -e '(.[0] | del(.release.workflow_run_attempt, .release.generated_at)) ==
                     (.[1] | del(.release.workflow_run_attempt, .release.generated_at))' \
              "$local_manifest" "$downloaded_manifest" >/dev/null
          }
          # Accept a pre-existing lightweight tag only when it points to this exact source commit.
          stage="check existing tag"
          if tag_object=$(gh api "$ref" --jq '.object | [.type,.sha] | @tsv' 2>&1); then
            test "$tag_object" = $'commit\t'"$SOURCE_SHA"
          elif [[ "$tag_object" != *"(HTTP 404)"* ]]; then
            printf '%s\n' "$tag_object" >&2
            exit 1
          fi

          stage="inspect existing release"
          existing=$(get_release)
          if [[ "$existing" != null ]]; then
            if jq -e '.draft == false' <<< "$existing" >/dev/null; then
              stage="verify existing immutable release"
              verify_published_retry "$existing"
              test "$(gh api "$ref" --jq '.object | [.type,.sha] | @tsv')" = $'commit\t'"$SOURCE_SHA"
              echo "release_id=$(jq -r .id <<< "$existing")" >> "$GITHUB_OUTPUT"
              echo "release_url=$(jq -r .html_url <<< "$existing")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            jq -e --arg sha "$SOURCE_SHA" \
              '.draft == true and .immutable == false and .target_commitish == $sha' \
              <<< "$existing" >/dev/null
            # Drafts can have partial uploads; replace only one targeting this commit.
            stage="replace existing draft"
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

          stage="create draft release"
          gh release create "$RELEASE_TAG" "${release_files[@]}" \
            --repo "$GITHUB_REPOSITORY" --draft --target "$SOURCE_SHA" \
            --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"

          stage="verify draft inventory"
          draft=$(get_release)
          [[ "$draft" != null ]]
          # Publishing locks the tag and assets, so check the complete draft first.
          verify_inventory "$draft" true
          stage="publish verified draft"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

          stage="verify published release"
          published=$(get_release)
          verify_inventory "$published" false
          if [[ "$(jq -r .immutable <<< "$published")" != true ]]; then
            echo '::error::Published release is not immutable. Enable release immutability in repository settings.' >&2
            exit 1
          fi
          test "$(gh api "$ref" --jq '.object | [.type,.sha] | @tsv')" = $'commit\t'"$SOURCE_SHA"
          echo "release_id=$(jq -r .id <<< "$published")" >> "$GITHUB_OUTPUT"
          echo "release_url=$(jq -r .html_url <<< "$published")" >> "$GITHUB_OUTPUT"

      - name: Summarise publication failure
        if: failure()
        shell: bash
        env:
          COMPONENT: ${{ inputs.asset_subdirectory }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          FAILED_STAGE: ${{ steps.published.outputs.failed_stage || steps.verify.outputs.failed_stage || 'download release assets' }}
        run: |
          {
            printf '## Release publication failed\n\n- Component: `%s`\n- Stage: %s\n- Tag: `%s`\n- Source: `%s`\n- Run: `%s` (attempt `%s`)\n\nInspect the failed stage before rerunning the failed publication job.\n' \
              "$COMPONENT" "$FAILED_STAGE" "$RELEASE_TAG" "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_STEP_SUMMARY"
