name: Terraform UI Harness
run-name: Terraform UI Harness - ${{ inputs.environment }} (${{ inputs.apply && 'apply' || 'plan' }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: d01
        type: choice
        options:
          - d01
          - d02
          - d03
      apply:
        description: Apply changes (otherwise plan only)
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - "terraform/ui_test_harness/**"
      - "terraform/modules/**"
      - "terraform/environments/d01.tfvars"
      - ".github/workflows/terraform-ui-harness.yml"      
      - ".github/workflows/terraform-plan-and-apply.yml"
      - ".github/actions/load-tfvars/**"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform UI Harness for ${{ inputs.environment }} (${{ inputs.apply && 'apply' || 'plan' }})
    uses: ./.github/workflows/terraform-plan-and-apply.yml
    secrets: inherit
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'd01' }}
      apply: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
      root: terraform/ui_test_harness
      state_key: ${{ format('{0}/ui_test_harness.tfstate', (github.event_name == 'workflow_dispatch' && inputs.environment || 'd01')) }}