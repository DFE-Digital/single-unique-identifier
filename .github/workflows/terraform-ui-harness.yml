name: Terraform UI Harness
run-name: Terraform UI Harness - ${{ inputs.environment || 'd01' }} (${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply == true)) && 'apply' || 'plan' }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: d01
        type: choice
        options:
          - d01
          - d02
          - d03
      apply:
        description: Apply changes (otherwise plan only)
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - "terraform/ui_test_harness/**"
      - "terraform/modules/**"
      - "terraform/environments/d01.tfvars"
      - ".github/workflows/terraform-ui-harness.yml"      
      - ".github/workflows/terraform-plan-and-apply.yml"
      - ".github/actions/load-tfvars/**"
  push:
    branches:
      - main
    paths:
      - "terraform/ui_test_harness/**"
      - "terraform/modules/**"
      - "terraform/environments/d01.tfvars"
      - ".github/workflows/terraform-ui-harness.yml"
      - ".github/workflows/terraform-plan-and-apply.yml"
      - ".github/actions/load-tfvars/**"

permissions:
  id-token: write
  contents: read
  
concurrency:
  group: terraform-ui-harness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform UI Harness for ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'd01' }} (${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply == true)) && 'apply' || 'plan' }})
    uses: ./.github/workflows/terraform-plan-and-apply.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      UI_TEST_HARNESS_PASSWORD: ${{ secrets.UI_TEST_HARNESS_PASSWORD }}
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'd01' }}
      apply: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply == true) }}
      root: terraform/ui_test_harness
      state_key: ${{ format('{0}/ui_test_harness.tfstate', (github.event_name == 'workflow_dispatch' && inputs.environment || 'd01')) }}