name: Terraform Core Infrastructure
run-name: Terraform Core - ${{ inputs.environment || 'd01' }} (${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply == true)) && 'apply' || 'plan' }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: d01
        type: choice
        options:
          - d01
          - d02
          - d03
      apply:
        description: Apply changes (otherwise plan only)
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - "terraform/core/**"
      - "terraform/modules/**"
      - "terraform/environments/d01.tfvars"
      - ".github/workflows/terraform-core.yml"
      - ".github/workflows/terraform-plan-and-apply.yml"
      - ".github/actions/load-tfvars/**"
  push:
    branches:
      - main
    paths:
      - "terraform/core/**"
      - "terraform/modules/**"
      - "terraform/environments/d01.tfvars"
      - ".github/workflows/terraform-core.yml"
      - ".github/workflows/terraform-plan-and-apply.yml"
      - ".github/actions/load-tfvars/**"

permissions:
  id-token: write
  contents: read
  
concurrency:
  group: terraform-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform core for ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'd01' }} (${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply == true)) && 'apply' || 'plan' }})
    uses: ./.github/workflows/terraform-plan-and-apply.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'd01' }}
      apply: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply == true) }}
      root: terraform/core
