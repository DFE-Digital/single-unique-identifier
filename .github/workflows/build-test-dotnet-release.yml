name: Build and Test Dotnet Project (release)

on:
  workflow_call:
    inputs:
      directory_name:
        type: string
        required: true
      project_names:
        description: JSON array of project names
        type: string
        required: true
      requires_azurite:
        description: If true, azurite will be spun up as a build dependency
        default: false
        type: boolean
      skip_tests:
        description: Skip test execution and related setup (Azurite, coverage)
        default: false
        type: boolean
      skip_scans:
        description: Skip SonarCloud scan steps
        default: false
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: false
    outputs:
      tests:
        description: Actual test step outcome
        value: ${{ jobs.build-test-dotnet.outputs.tests }}
      sonar_quality_gate:
        description: Actual SonarCloud step outcome
        value: ${{ jobs.build-test-dotnet.outputs.sonar_quality_gate }}

permissions:
  contents: read

jobs:
  build-test-dotnet:
    timeout-minutes: 30
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      pull-requests: write
      packages: read
    env:
      PROJECTS_JSON: ${{ inputs.project_names }}
    outputs:
      tests: ${{ steps.run-tests.outcome }}
      sonar_quality_gate: ${{ steps.sonar-end.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create NuGet packages directory
        run: mkdir -p ${{ github.workspace }}/.nuget/packages

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            nuget.config
            ${{ inputs.directory_name }}/**/*.csproj
            ${{ inputs.directory_name }}/**/packages.lock.json
            Libs/**/*.csproj
            Libs/**/packages.lock.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

      - name: Log .NET SDK version
        run: dotnet --version

      - name: Setup Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "microsoft"
          java-version: 21

      - name: Setup Node.js (for Azurite and artifact upload)
        if: inputs.requires_azurite == true && inputs.skip_tests != true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install and start Azurite
        if: inputs.requires_azurite == true && inputs.skip_tests != true
        run: |
          npm i -g azurite
          azurite \
            --blobHost 127.0.0.1 --blobPort 10000 \
            --queueHost 127.0.0.1 --queuePort 10001 \
            --tableHost 127.0.0.1 --tablePort 10002 \
            --location /tmp/azurite \
            --debug /tmp/azurite/debug.log &
          for port in 10000 10001 10002; do
            for i in {1..20}; do
              (echo > /dev/tcp/127.0.0.1/$port) >/dev/null 2>&1 && break
              sleep 0.5
            done
          done

      - name: Install test coverage tools
        if: inputs.skip_tests != true
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Install SonarScanner
        if: inputs.skip_scans != true
        run: |
          dotnet tool install --global dotnet-sonarscanner

      - name: Add .NET tools to PATH
        if: inputs.skip_tests != true || inputs.skip_scans != true
        run: |
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Set up NuGet authentication
        run: |
          echo "Writing NuGet Auth config..."
          dotnet nuget update source DFEDigital --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      - name: Start SonarCloud Scanner
        if: inputs.skip_scans != true
        run: |
          coverage_arg=""
          if [ "${{ inputs.skip_tests }}" != "true" ]; then
            coverage_arg="/d:sonar.coverageReportPaths=./${{ inputs.directory_name }}/CoverageReport/SonarQube.xml"
          fi
          dotnet-sonarscanner begin \
            /k:"DFE-Digital_single-unique-identifier" \
            /o:"dfe-digital" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true \
            $coverage_arg \
            /d:sonar.coverage.exclusions="**/Program.cs,**/*.json" \
            /d:sonar.exclusions="**/wwwroot/**" \
            /d:sonar.cpd.exclusions="**/Program.cs" \
            /d:sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:S6602 \
            /d:sonar.scanner.skipJreProvisioning=true \
            /d:sonar.scanner.scanAll=false
        env:
          NuGetPackageSourceCredentials_DFEDigital: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

      - name: Build project
        run: |
          dotnet restore ./${{ inputs.directory_name }} --locked-mode -p:RestorePackagesWithLockFile=true
          dotnet build ./${{ inputs.directory_name }} -c Release --no-restore --no-incremental

      - name: Run tests
        id: run-tests
        if: inputs.skip_tests != true
        run: dotnet test ./${{ inputs.directory_name }} -c Release --no-build --verbosity normal --settings ${{ inputs.directory_name }}/tests.runsettings --filter "Category!=Smoke"

      - name: Generate coverage report
        if: inputs.skip_tests != true
        run: |
          reportgenerator -reports:./${{ inputs.directory_name }}/**/coverage.cobertura.xml -targetdir:${{ inputs.directory_name }}/CoverageReport -reporttypes:SonarQube,Html,MarkdownSummaryGithub
          dotnet coverage merge --reports "${{ inputs.directory_name }}/**/coverage.cobertura.xml" -f cobertura -o ${{ inputs.directory_name }}/coverage/coverage.xml

      - name: End SonarCloud Scanner
        id: sonar-end
        if: inputs.skip_scans != true
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        env:
          NuGetPackageSourceCredentials_DFEDigital: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

      - name: Package tested publish output
        id: package
        run: |
          app="${{ inputs.directory_name }}"
          app="${app##*/}"
          sha="${GITHUB_SHA::7}"
          date=$(date +%Y%m%d)
          for proj in $(echo "$PROJECTS_JSON" | jq -r '.[]'); do
            out="publish/$proj"
            mkdir -p "$out"
            dotnet publish "${{ inputs.directory_name }}/src/$proj/$proj.csproj" -c Release --no-build -o "$out"
            name="${app}-${proj}-${date}-${sha}-build"
            zip_name="${name}.zip"
            (cd "$out" && zip -r "../../${zip_name}" .)
          done
          echo "release_artifact_name=release-zips-${app}" >> "$GITHUB_OUTPUT"

      - name: Upload deployment ZIPs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.release_artifact_name }}
          path: '*.zip'
          if-no-files-found: error

      - name: Add Coverage PR Comment
        if: github.event_name == 'pull_request' && inputs.skip_tests != true
        uses: ./.github/actions/post-coverage-comment
        with:
          directory_name: ${{ inputs.directory_name }}
