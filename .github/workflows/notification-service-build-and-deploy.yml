name: 'Build, Test: "Notification Service" Solution'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload build artifacts
        required: false
        default: false
        type: boolean
      artifact_store:
        description: Artifact storage backend (github or azure)
        required: false
        default: azure
        type: string
      skip_tests:
        description: Skip tests and related setup
        required: false
        default: false
        type: boolean
      skip_scans:
        description: Skip SonarCloud scans
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "Apps/NotificationService/**"
      - "Data/**"
  pull_request:
    branches:
      - main
    paths:
      - "Apps/NotificationService/**"
      - "Data/**"

jobs:
  build-and-test-NotificationService:
    name: NotificationService - Build Test Dotnet
    uses: ./.github/workflows/build-test-dotnet.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      checks: write
      packages: read
      actions: write
    with:
      directory_name: Apps/NotificationService
      project_names: '["SUI.NotificationService"]'
      requires_azurite: true
      upload_artifacts: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_artifacts == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      artifact_store: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.artifact_store || vars.ARTIFACT_STORE || 'azure' }}
      skip_tests: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true' }}
      skip_scans: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_scans == 'true' }}