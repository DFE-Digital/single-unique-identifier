name: 'Build, Test, Deploy: "Get An Identifier" Solution'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: d01
        type: choice
        options:
          - d01
          - d02
          - d03
      deploy:
        description: Deploy to Azure Function App
        required: false
        default: false
        type: boolean
      run_smoke_tests:
        description: Run smoke tests against target environment
        required: false
        default: true
        type: boolean
      upload_artifacts:
        description: Upload build artifacts (auto-enabled when deploying)
        required: false
        default: false
        type: boolean
      artifact_store:
        description: Artifact storage backend (github or azure)
        required: false
        default: azure
        type: string
      skip_tests:
        description: Skip tests and related setup
        required: false
        default: false
        type: boolean
      skip_scans:
        description: Skip SonarCloud scans
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "Apps/GetAnIdentifier/**"
      - "Data/**"
  pull_request:
    branches:
      - main
    paths:
      - "Apps/GetAnIdentifier/**"
      - "Data/**"

jobs:
  build-and-test-GetAnIdentifier:
    name: GetAnIdentifier - Build Test Dotnet
    uses: ./.github/workflows/build-test-dotnet.yml
    secrets:
      AZURE_ARTIFACTS_ACCOUNT: ${{ secrets.AZURE_ARTIFACTS_ACCOUNT }}
      AZURE_ARTIFACTS_CONTAINER: ${{ secrets.AZURE_ARTIFACTS_CONTAINER }}
      AZURE_ARTIFACTS_SAS: ${{ secrets.AZURE_ARTIFACTS_SAS }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      checks: write
      packages: read
    with:
      directory_name: Apps/GetAnIdentifier
      project_names: '["SUI.GetAnIdentifier.API"]'
      requires_azurite: true
      upload_artifacts: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy == 'true' || github.event.inputs.upload_artifacts == 'true')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      artifact_store: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.artifact_store || vars.ARTIFACT_STORE || 'azure' }}
      skip_tests: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true' }}
      skip_scans: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_scans == 'true' }}
      deploy_requested: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' }}

  deploy-GetAnIdentifier:
    name: GetAnIdentifier - Deploy Function App
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build-and-test-GetAnIdentifier
    uses: ./.github/workflows/deploy-dotnet-functionapp.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ARTIFACTS_ACCOUNT: ${{ secrets.AZURE_ARTIFACTS_ACCOUNT }}
      AZURE_ARTIFACTS_CONTAINER: ${{ secrets.AZURE_ARTIFACTS_CONTAINER }}
      AZURE_ARTIFACTS_SAS: ${{ secrets.AZURE_ARTIFACTS_SAS }}
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'd01' }}
      directory_name: Apps/GetAnIdentifier
      artifact_name: ${{ fromJson(needs.build-and-test-GetAnIdentifier.outputs.artifact_names)['SUI.GetAnIdentifier.API'] }}
      artifact_store: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.artifact_store || vars.ARTIFACT_STORE || 'azure' }}
      component_descriptor: getanid01
      package_path: publish

  smoke-test-GetAnIdentifier:
    name: GetAnIdentifier - Post-Deploy Smoke Tests
    timeout-minutes: 15
    needs: [ deploy-GetAnIdentifier ]
    if: |
      always() &&
      !cancelled() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.deploy-GetAnIdentifier.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.run_smoke_tests == true || inputs.run_smoke_tests == 'true') &&
          needs.deploy-GetAnIdentifier.result != 'failure'
        )
      )
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'd01' }}
      deployment: false
    env:
      TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'd01' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Load tfvars for ${{ env.TARGET_ENVIRONMENT }}
        id: env_config
        uses: ./.github/actions/load-tfvars
        with:
          environment: ${{ env.TARGET_ENVIRONMENT }}

      - name: Azure login with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Smoke Tests
        run: dotnet test Apps/GetAnIdentifier/tests/SUI.GetAnIdentifier.SmokeTests/SUI.GetAnIdentifier.SmokeTests.csproj --filter "Category=Smoke"
        env:
          SMOKE_TEST_BASE_URL: ${{ secrets.FAUAPI_BASE_URL }}
          SMOKE_TEST_TOKEN_URL: ${{ secrets.AUTH_SETTINGS__ACCESS_TOKEN_URL }}
          SMOKE_TEST_CLIENT_IDS_JSON_MAP: ${{ secrets.AUTH_CLIENT_IDS_JSON_MAP }}
          SMOKE_TEST_CLIENT_SECRETS_JSON_MAP: ${{ secrets.AUTH_CLIENT_SECRETS_JSON_MAP }}
          # D01 does not need a scope if the token is to be tested as of present, due to the use of the AuthEmulator
          # D02, and D03 will use FaUAPI entirely and this requires different Azure Auth config values to D01
          SMOKE_TEST_AUTH_SCOPE: ${{ env.TARGET_ENVIRONMENT != 'd01' && secrets.AUTH_SETTINGS__OAUTH_SCOPE || '' }}