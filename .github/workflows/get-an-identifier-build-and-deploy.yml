name: 'Build, Test, Deploy: "Get An Identifier" Solution'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: d01
        type: choice
        options:
          - d01
          - d02
          - d03
      deploy:
        description: Deploy to Azure Function App
        required: false
        default: false
        type: boolean
      run_smoke_tests:
        description: Run smoke tests against target environment
        required: false
        default: true
        type: boolean
      upload_artifacts:
        description: Upload build artifacts (auto-enabled when deploying)
        required: false
        default: false
        type: boolean
      skip_tests:
        description: Skip tests and related setup
        required: false
        default: false
        type: boolean
      skip_scans:
        description: Skip SonarCloud scans
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "Apps/GetAnIdentifier/**"
      - "Data/**"
  pull_request:
    branches:
      - main

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            app:
              - "Apps/GetAnIdentifier/**"
              - "Data/**"
              - ".github/workflows/get-an-identifier-build-and-deploy.yml"
              - ".github/workflows/build-test-dotnet.yml"

  build-and-test-GetAnIdentifier:
    name: GetAnIdentifier - Build Test Dotnet
    needs: detect-changes
    # Skips the job if it's a PR and no relevant files changed; ci-gate reports the final status.
    if: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.has_changes == 'true' }}
    uses: ./.github/workflows/build-test-dotnet.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      checks: write
      packages: read
    with:
      directory_name: Apps/GetAnIdentifier
      project_names: '["SUI.GetAnIdentifier.API"]'
      requires_azurite: true
      upload_artifacts: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy == 'true' || github.event.inputs.upload_artifacts == 'true')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      skip_tests: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true' }}
      skip_scans: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_scans == 'true' }}
      deploy_requested: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' }}

  deploy-GetAnIdentifier:
    name: GetAnIdentifier - Deploy Function App
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build-and-test-GetAnIdentifier
    uses: ./.github/workflows/deploy-dotnet-functionapp.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    permissions:
      id-token: write
      contents: read
      actions: read
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'd01' }}
      directory_name: Apps/GetAnIdentifier
      artifact_name: ${{ fromJson(needs.build-and-test-GetAnIdentifier.outputs.artifact_names)['SUI.GetAnIdentifier.API'] }}
      artifact_run_id: ${{ github.run_id }}
      component_descriptor: getanid01
      package_path: publish

  smoke-test-GetAnIdentifier:
    name: GetAnIdentifier - Post-Deploy Smoke Tests
    timeout-minutes: 15
    needs: [ deploy-GetAnIdentifier ]
    if: |
      always() &&
      !cancelled() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.deploy-GetAnIdentifier.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.run_smoke_tests == true || inputs.run_smoke_tests == 'true') &&
          needs.deploy-GetAnIdentifier.result != 'failure'
        )
      )
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'd01' }}
      deployment: false
    env:
      TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'd01' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Load tfvars for ${{ env.TARGET_ENVIRONMENT }}
        id: env_config
        uses: ./.github/actions/load-tfvars
        with:
          environment: ${{ env.TARGET_ENVIRONMENT }}

      - name: Azure login with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Smoke Tests
        run: dotnet test Apps/GetAnIdentifier/tests/SUI.GetAnIdentifier.SmokeTests/SUI.GetAnIdentifier.SmokeTests.csproj --filter "Category=Smoke"
        env:
          SMOKE_TEST_BASE_URL: ${{ secrets.FAUAPI_BASE_URL }}
          SMOKE_TEST_TOKEN_URL: ${{ secrets.AUTH_SETTINGS__ACCESS_TOKEN_URL }}
          SMOKE_TEST_CLIENT_IDS_JSON_MAP: ${{ secrets.AUTH_CLIENT_IDS_JSON_MAP }}
          SMOKE_TEST_CLIENT_SECRETS_JSON_MAP: ${{ secrets.AUTH_CLIENT_SECRETS_JSON_MAP }}
          # D01 does not need a scope if the token is to be tested as of present, due to the use of the AuthEmulator
          # D02, and D03 will use FaUAPI entirely and this requires different Azure Auth config values to D01
          SMOKE_TEST_AUTH_SCOPE: ${{ env.TARGET_ENVIRONMENT != 'd01' && secrets.AUTH_SETTINGS__OAUTH_SCOPE || '' }}

  # Required status check gate for branch protection.
  # Reusable workflow caller jobs do not report inner job names when skipped via `if:`,
  # so this always-running job provides a stable check name that passes on skip or success.
  ci-gate: #TODO: remove after test
    name: GetAnIdentifier - CI Gate
    needs: [ detect-changes, build-and-test-GetAnIdentifier ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI status
        run: |
          if [[ "${{ needs.detect-changes.result }}" != "success" ]]; then
            echo "detect-changes failed."
            exit 1
          fi
          if [[ "${{ needs.build-and-test-GetAnIdentifier.result }}" != "success" && "${{ needs.build-and-test-GetAnIdentifier.result }}" != "skipped" ]]; then
            echo "Build/test job failed or was cancelled (result: ${{ needs.build-and-test-GetAnIdentifier.result }})."
            exit 1
          fi