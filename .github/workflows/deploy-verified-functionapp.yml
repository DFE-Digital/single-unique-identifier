name: Deploy verified release to Azure Functions

on:
  workflow_call:
    inputs:
      release_id:
        type: string
        required: true
      artifact_id:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      digest:
        type: string
        required: true
      app:
        type: string
        required: true
      target_environment:
        type: string
        required: true
      approval_environment:
        type: string
        required: true
      smoke_test_project:
        type: string
        required: true
      requires_smoke_auth_scope:
        type: boolean
        default: false

permissions: {}

jobs:
  deploy:
    name: Release ${{ inputs.release_id }} to ${{ inputs.target_environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ inputs.app }}-release-${{ inputs.target_environment }}
      cancel-in-progress: false
      queue: max
    environment:
      name: ${{ inputs.approval_environment }}
    env:
      RULE_NAME: github-deploy-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check deployment inputs
        shell: bash
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          FUNCTION_APP_NAME: ${{ vars.PROMOTION_FUNCTION_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.PROMOTION_FUNCTION_APP_RESOURCE_GROUP }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::A verified artifact ID is required"
            exit 1
          fi
          if [[ -z "$FUNCTION_APP_NAME" || -z "$RESOURCE_GROUP" ]]; then
            echo "::error::Set PROMOTION_FUNCTION_APP_NAME and PROMOTION_FUNCTION_APP_RESOURCE_GROUP on the deployment environment"
            exit 1
          fi

      - name: Download verified ZIP
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/verified-functionapp
          digest-mismatch: error

      - name: Confirm ZIP digest and summarise release
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_DIGEST: ${{ inputs.digest }}
          PACKAGE_PATH: ${{ steps.download.outputs.download-path }}/release.zip
        run: |
          [[ "$RELEASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "${RELEASE_DIGEST#sha256:}" "$PACKAGE_PATH" | sha256sum --check
          printf 'Release ID: %s\n\nSource SHA: %s\n\nZIP digest: %s\n' \
            "$RELEASE_ID" "$SOURCE_SHA" "$RELEASE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify smoke test configuration
        shell: bash
        env: &smoke_settings
          SMOKE_TEST_PROJECT: ${{ inputs.smoke_test_project }}
          SMOKE_TEST_BASE_URL: ${{ secrets.PROMOTION_SMOKE_TEST_BASE_URL }}
          SMOKE_TEST_TOKEN_URL: ${{ secrets.PROMOTION_SMOKE_TEST_TOKEN_URL }}
          SMOKE_TEST_CLIENT_IDS_JSON_MAP: ${{ secrets.PROMOTION_SMOKE_TEST_CLIENT_IDS_JSON_MAP }}
          SMOKE_TEST_CLIENT_SECRETS_JSON_MAP: ${{ secrets.PROMOTION_SMOKE_TEST_CLIENT_SECRETS_JSON_MAP }}
          SMOKE_TEST_AUTH_SCOPE: ${{ secrets.PROMOTION_SMOKE_TEST_AUTH_SCOPE }}
          REQUIRE_AUTH_SCOPE: ${{ inputs.requires_smoke_auth_scope }}
        run: |
          test -f "$SMOKE_TEST_PROJECT"
          for setting in SMOKE_TEST_BASE_URL SMOKE_TEST_TOKEN_URL SMOKE_TEST_CLIENT_IDS_JSON_MAP SMOKE_TEST_CLIENT_SECRETS_JSON_MAP; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing promotion smoke test setting: $setting"
              exit 1
            fi
          done
          if [ "$REQUIRE_AUTH_SCOPE" = true ] && [ -z "$SMOKE_TEST_AUTH_SCOPE" ]; then
            echo "::error::Missing promotion smoke test setting: SMOKE_TEST_AUTH_SCOPE"
            exit 1
          fi

      - name: Setup .NET for smoke tests
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Login to Azure with deployment identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.PROMOTION_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PROMOTION_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PROMOTION_AZURE_SUBSCRIPTION_ID }}

      - name: Discover runner IPv4
        id: ip
        shell: bash
        run: |
          ipv4=$(curl --ipv4 --fail --silent --show-error --max-time 20 https://api.ipify.org)
          [[ "$ipv4" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          echo "ipv4=$ipv4" >> "$GITHUB_OUTPUT"

      - name: Open Function App SCM access
        id: open_access
        uses: ./.github/actions/open-function-app-access
        with:
          app_name: ${{ vars.PROMOTION_FUNCTION_APP_NAME }}
          resource_group: ${{ vars.PROMOTION_FUNCTION_APP_RESOURCE_GROUP }}
          runner_ip: ${{ steps.ip.outputs.ipv4 }}
          rule_name: ${{ env.RULE_NAME }}

      - name: Deploy verified ZIP
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ vars.PROMOTION_FUNCTION_APP_NAME }}
          package: ${{ steps.download.outputs.download-path }}/release.zip
          respect-funcignore: false
          remote-build: false
          scm-do-build-during-deployment: false
          enable-oryx-build: false

      - name: Restore Function App SCM access restrictions
        id: close_access
        if: always() && steps.open_access.outputs.resource_group != ''
        uses: ./.github/actions/close-function-app-access
        with:
          app_name: ${{ vars.PROMOTION_FUNCTION_APP_NAME }}
          resource_group: ${{ steps.open_access.outputs.resource_group }}
          rule_name: ${{ env.RULE_NAME }}

      - name: Require successful SCM cleanup
        env:
          CLEANUP_OUTCOME: ${{ steps.close_access.outcome }}
        run: test "$CLEANUP_OUTCOME" = success

      - name: Run smoke tests
        timeout-minutes: 15
        run: dotnet test "$SMOKE_TEST_PROJECT" --filter "Category=Smoke" -- RunConfiguration.TreatNoTestsAsError=true
        env: *smoke_settings
