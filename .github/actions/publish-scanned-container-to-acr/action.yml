name: Publish scanned container to ACR
description: Push an already scanned local image to Azure Container Registry and record its digest.
inputs:
  local-image:
    description: Local image tag that passed the vulnerability scan.
    required: true
  registry-name:
    description: Azure Container Registry name. The caller must already be authenticated to Azure.
    required: true
  registry-server:
    description: Registry login server, such as example.azurecr.io.
    required: true
  repository:
    description: Repository path within the registry.
    required: true
  tag:
    description: Tag to apply to the image in the registry.
    required: true
  dockerfile:
    description: Dockerfile with a digest-pinned final runtime base image.
    required: true
  metadata-path:
    description: Path for the generated container metadata JSON.
    required: false
    default: container.json
outputs:
  repository:
    description: Fully qualified image repository.
    value: ${{ steps.publish.outputs.repository }}
  digest:
    description: Digest returned by Azure Container Registry for the pushed image.
    value: ${{ steps.publish.outputs.digest }}
  metadata-path:
    description: Path to the generated metadata JSON.
    value: ${{ inputs.metadata-path }}
runs:
  using: composite
  steps:
    - name: Push scanned image and record registry digest
      id: publish
      shell: bash
      env:
        LOCAL_IMAGE: ${{ inputs.local-image }}
        REGISTRY_NAME: ${{ inputs.registry-name }}
        REGISTRY_SERVER: ${{ inputs.registry-server }}
        REPOSITORY: ${{ inputs.repository }}
        IMAGE_TAG: ${{ inputs.tag }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        METADATA_PATH: ${{ inputs.metadata-path }}
      run: bash "$GITHUB_ACTION_PATH/publish.sh"
