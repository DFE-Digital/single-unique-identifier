name: Open Function App SCM Access
description: Temporarily whitelists a runner IP on the Function App SCM endpoint and enables publicNetworkAccess.

inputs:
  app_name:
    description: Name of the Azure Function App
    required: true
  resource_group:
    description: Resource group of the Function App, if known
    required: false
  runner_ip:
    description: IP address of the GitHub Actions runner
    required: true
  rule_name:
    description: Unique name for the temporary access restriction rule
    required: true

outputs:
  resource_group:
    description: The Function App resource group when cleanup is needed
    value: ${{ steps.whitelist.outputs.rg }}

runs:
  using: composite
  steps:
    - name: Temporarily Whitelist Runner IP
      id: whitelist
      shell: bash
      env:
        APP_NAME: ${{ inputs.app_name }}
        RESOURCE_GROUP: ${{ inputs.resource_group }}
        RUNNER_IP: ${{ inputs.runner_ip }}
        RULE_NAME: ${{ inputs.rule_name }}
      run: |
        source .github/scripts/retry-command.sh

        rg="$RESOURCE_GROUP"
        if [ -z "$rg" ]; then
          rg=$(az functionapp list --query "[?name=='$APP_NAME'].resourceGroup" -o tsv)
        fi

        if [ -z "$rg" ]; then
          echo "Could not find Resource Group for $APP_NAME"
          exit 1
        fi

        [[ "$RULE_NAME" =~ ^github-deploy-[0-9]+-[0-9]+$ ]]
        # Both deployment workflows use this reserved SCM rule name format.
        # The caller must hold the deployment lock for this Function App.
        deployment_rules() {
          az functionapp config access-restriction show --resource-group "$rg" --name "$APP_NAME" |
            jq -r '.scmIpSecurityRestrictions[] | .name | strings | select(test("^github-deploy-[0-9]+-[0-9]+$"))'
        }

        stale_rules=$(deployment_rules)
        recovery_failed=false

        if [ -n "$stale_rules" ]; then
          echo "rg=$rg" >> "$GITHUB_OUTPUT"
          if ! retry_command az functionapp update --resource-group "$rg" --name "$APP_NAME" --set publicNetworkAccess=Disabled; then
            echo "::error::Failed to disable publicNetworkAccess during SCM recovery."
            recovery_failed=true
          fi
        fi

        for stale_rule in $stale_rules; do
          echo "Removing orphaned rule: $stale_rule"
          if ! retry_command az functionapp config access-restriction remove --resource-group "$rg" --name "$APP_NAME" --rule-name "$stale_rule" --scm-site true; then
            echo "::error::Failed to remove stale rule $stale_rule after retries."
            recovery_failed=true
          fi
        done

        if ! pna=$(az functionapp show --resource-group "$rg" --name "$APP_NAME" --query publicNetworkAccess -o tsv); then
          echo "::error::Could not verify that publicNetworkAccess is Disabled."
          recovery_failed=true
        elif [ "$pna" != Disabled ]; then
          echo "::error::publicNetworkAccess must be Disabled before deployment starts. Check the Function App in Azure before retrying."
          recovery_failed=true
        fi

        if ! remaining_stale=$(deployment_rules); then
          echo "::error::Could not verify that stale SCM rules are absent."
          recovery_failed=true
        elif [ -n "$remaining_stale" ]; then
          echo "::error::Stale rules still remain after cleanup attempt."
          recovery_failed=true
        fi

        if [ "$recovery_failed" = true ]; then
          exit 1
        fi

        echo "Running preflight security checks..."

        restrictions=$(az functionapp config access-restriction show --resource-group "$rg" --name "$APP_NAME")

        main_default=$(echo "$restrictions" | jq -r '.ipSecurityRestrictionsDefaultAction')
        scm_default=$(echo "$restrictions" | jq -r '.scmIpSecurityRestrictionsDefaultAction')
        use_main=$(echo "$restrictions" | jq -r '.scmIpSecurityRestrictionsUseMain')

        if [ "$main_default" != "Deny" ] || [ "$scm_default" != "Deny" ]; then
          echo "::error::Default access restriction action is not Deny (Main: $main_default, SCM: $scm_default)."
          exit 1
        fi

        if [ "$use_main" != "false" ]; then
          echo "::error::SCM is inheriting main site restrictions (scmIpSecurityRestrictionsUseMain is true)."
          exit 1
        fi

        main_allow_rules=$(echo "$restrictions" | jq -r '[.ipSecurityRestrictions[] | select(.action=="Allow")] | length')
        if [ "$main_allow_rules" -gt 0 ]; then
          echo "::error::Found $main_allow_rules unexpected Allow rule(s) on the main API. The main API must have zero allow rules during deployment."
          exit 1
        fi

        scm_open_rules=$(echo "$restrictions" | jq -r '[.scmIpSecurityRestrictions[] | select(.action=="Allow" and (.ipAddress=="Any" or .ipAddress=="0.0.0.0/0"))] | length')
        if [ "$scm_open_rules" -gt 0 ]; then
          echo "::error::Found unexpected public Allow rules (0.0.0.0/0) on the SCM endpoint."
          exit 1
        fi

        echo "Preflight checks passed! Adding IP $RUNNER_IP to $APP_NAME SCM/Kudu endpoint only..."

        # From here a partial failure can leave an access change that needs cleanup.
        echo "rg=$rg" >> "$GITHUB_OUTPUT"
        az functionapp config access-restriction add \
          --resource-group "$rg" \
          --name "$APP_NAME" \
          --rule-name "$RULE_NAME" \
          --action Allow \
          --ip-address "$RUNNER_IP/32" \
          --priority 100 \
          --scm-site true

        echo "Temporarily enabling publicNetworkAccess master switch..."
        az functionapp update --resource-group "$rg" --name "$APP_NAME" --set publicNetworkAccess=Enabled

        echo "Waiting for Azure firewall to propagate..."

        # Smart polling: ping the SCM endpoint until it stops returning 403
        # We expect a 401 (Unauthorized) because our curl lacks credentials, 
        # but 401 proves the network firewall has allowed our IP through.
        SCM_URL="https://${APP_NAME}.scm.azurewebsites.net"

        end=$((SECONDS+180)) # 3 minute maximum timeout
        ready=false

        while [ $SECONDS -lt $end ]; do
          status=$(curl -s -o /dev/null -w "%{http_code}" "$SCM_URL")
          if [ "$status" == "401" ]; then
            echo "✅ Firewall propagated! Kudu returned HTTP $status (Unauthorized - Expected)"
            ready=true
            break
          fi
          echo "Still waiting for firewall to sync... (HTTP $status). Retrying in 10s..."
          sleep 10
        done

        if [ "$ready" = false ]; then
          echo "::error::Firewall propagation timed out after 3 minutes. Could not verify Kudu connectivity."
          exit 1
        fi
