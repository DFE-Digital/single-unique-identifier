info:
  name: HealthCheck
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/health"
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{access_token_url}}"
    credentials:
      clientId: "{{client_id}}"
      clientSecret: "{{client_secret}}"
      placement: body
    scope: "{{auth_scope}}"
    tokenConfig:
      id: Authorization
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
